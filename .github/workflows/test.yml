name: 腳本驗證與測試

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  lint:
    name: 語法與靜態分析
    runs-on: ubuntu-latest
    steps:
    - name: 檢出代碼
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: 安裝 ShellCheck
      run: sudo apt-get update && sudo apt-get install -y shellcheck

    - name: Bash 語法驗證（全部腳本）
      run: |
        status=0
        for f in *.sh legacy/*.sh; do
          echo "🔍 bash -n $f"
          bash -n "$f" || status=1
        done
        exit $status

    - name: ShellCheck 靜態分析（發佈腳本，強制通過）
      run: |
        shellcheck --severity=warning secure-deploy.sh secure_ssh.sh upgrade.sh zabbix-agent2-install.sh update-checksums.sh

  integrity:
    name: 完整性與一致性檢查
    runs-on: ubuntu-latest
    steps:
    - name: 檢出代碼
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: 驗證 checksums.sha256 與實際檔案一致
      run: |
        echo "🔍 sha256sum -c checksums.sha256"
        sha256sum -c checksums.sha256

    - name: 驗證 README 校驗表與 checksums.sha256 一致
      run: |
        echo "🔍 比對 README <!-- CHECKSUMS --> 區塊..."
        status=0
        while read -r hash file; do
          if ! grep -qF "$hash" README.md; then
            echo "❌ README.md 缺少 $file 的最新校驗和 ($hash)"
            status=1
          fi
        done < checksums.sha256
        # README 校驗區塊內不得出現 checksums.sha256 以外的雜湊（防止殘留過期值）
        stale=$(awk '/<!-- CHECKSUMS START -->/{f=1;next} /<!-- CHECKSUMS END -->/{f=0} f' README.md \
          | grep -oE '[0-9a-f]{64}' | sort -u \
          | grep -vxF -f <(awk '{print $1}' checksums.sha256) || true)
        if [ -n "$stale" ]; then
          echo "❌ README 校驗區塊含有過期/未知的雜湊值:"
          echo "$stale"
          status=1
        fi
        exit $status

    - name: 驗證 VERSION 檔案格式
      run: |
        VERSION=$(tr -d '[:space:]' < VERSION)
        if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "❌ VERSION 格式不正確: '$VERSION'（應為 X.Y.Z）"
          exit 1
        fi
        echo "✅ VERSION: $VERSION"

    - name: 驗證必要文件
      run: |
        for file in README.md VERSION CHANGELOG.md SECURITY.md .gitignore LICENSE checksums.sha256; do
          if [[ ! -f "$file" ]]; then
            echo "❌ 缺少必要文件: $file"
            exit 1
          fi
        done
        echo "✅ 必要文件齊全"

  quality:
    name: 程式碼品質檢查
    runs-on: ubuntu-latest
    steps:
    - name: 檢出代碼
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: 檢查 strict mode
      run: |
        status=0
        for file in secure-deploy.sh secure_ssh.sh upgrade.sh zabbix-agent2-install.sh update-checksums.sh; do
          if ! head -n 5 "$file" | grep -q "set -euo pipefail"; then
            echo "❌ $file 缺少 'set -euo pipefail'"
            status=1
          fi
        done
        exit $status

    - name: 檢查行尾空白與 Tab
      run: |
        status=0
        if grep -rn ' $' -- *.sh; then
          echo "❌ 發現行尾空白"
          status=1
        fi
        if grep -rn $'\t' -- *.sh; then
          echo "❌ 發現 Tab 字符，請使用空格"
          status=1
        fi
        exit $status

    - name: 檢查危險模式（強制阻擋）
      run: |
        status=0
        for pattern in "eval " "chmod 777" "curl -fsSL[^\"]*\| *(sudo )?bash"; do
          if grep -rnE "$pattern" -- *.sh; then
            echo "❌ 發現危險模式: $pattern"
            status=1
          fi
        done
        exit $status
